name: Career OS Mac Production Canary

on:
  workflow_dispatch:
    inputs:
      run_canary:
        description: Run one controlled canary with bounded automatic repair
        required: true
        default: true
        type: boolean
  push:
    branches: [main]

concurrency:
  group: career-os-mac-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

jobs:
  production-canary:
    runs-on: [self-hosted]
    timeout-minutes: 120
    env:
      CAREER_OS_RUNTIME: /Users/tomasnieves/Library/Application Support/CareerOSCompanionRuntime/answerbrief-ai-automation-starter
      CAREER_OS_SOURCE: ${{ github.workspace }}/answerbrief-ai-automation-starter
      CAREER_OS_DEBUG_CLAIM: '1'
      CAREER_OS_DAILY_LIMIT: '1'
      CAREER_OS_AUTO_REPAIR: '1'
      CAREER_OS_SUPERVISOR_MAX_ATTEMPTS: '3'
      ANSWERBRIEF_EXECUTOR_PROVIDER_ORDER: openhands,gemini,opencode,aider,claude-code,codex
      PATH: /Users/tomasnieves/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Report runner start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: `Mac production runner started.\n\n- Run: ${context.runId}\n- Commit: ${context.sha}\n- Runner: ${process.env.RUNNER_NAME || 'unknown'}\n- Time: ${new Date().toISOString()}`
            });

      - name: Validate dependency lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$CAREER_OS_SOURCE"
          test -f package.json
          test -f package-lock.json
          npm ci --ignore-scripts --dry-run

      - name: Back up and deploy to canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test -f "$CAREER_OS_SOURCE/package.json"
          test -d "$CAREER_OS_RUNTIME"
          if test ! -f "$CAREER_OS_RUNTIME/.env" && test ! -f "$CAREER_OS_RUNTIME/.env.local"; then
            echo "Canonical Career OS runtime environment file is missing."
            exit 1
          fi

          BACKUP_ROOT="$HOME/CareerOSBackups/${GITHUB_RUN_ID}"
          mkdir -p "$BACKUP_ROOT"
          tar -czf "$BACKUP_ROOT/runtime-before-deploy.tgz" \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git' \
            --exclude='.career-os-browser-worker/chrome-profile' \
            -C "$(dirname "$CAREER_OS_RUNTIME")" "$(basename "$CAREER_OS_RUNTIME")"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.career-os-browser-worker/' \
            --exclude='.career-os-control/' \
            --exclude='.career-os-ci/' \
            "$CAREER_OS_SOURCE/" "$CAREER_OS_RUNTIME/"

          mkdir -p "$CAREER_OS_RUNTIME/.career-os-ci/${GITHUB_RUN_ID}"
          {
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "workspace=${GITHUB_WORKSPACE}"
            echo "runtime=${CAREER_OS_RUNTIME}"
            echo "backup=${BACKUP_ROOT}/runtime-before-deploy.tgz"
            uname -a
            echo "available_repair_providers:"
            for tool in openhands gemini opencode aider claude codex; do
              command -v "$tool" 2>/dev/null || true
            done
          } > "$CAREER_OS_RUNTIME/.career-os-ci/${GITHUB_RUN_ID}/runner.txt"

      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          cd "$CAREER_OS_RUNTIME"
          npm ci
          npm run typecheck 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/typecheck.log"
          npm run lint 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/lint.log"
          npm test 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/test.log"

      - name: Check OpenHands service
        shell: bash
        run: |
          set +e
          cd "$CAREER_OS_RUNTIME"
          npm run openhands:status 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/openhands-service.log"
          exit 0

      - name: Execute, observe, repair, retry
        if: github.event_name == 'push' || inputs.run_canary == true
        shell: bash
        run: |
          set -o pipefail
          cd "$CAREER_OS_RUNTIME"
          npm run supervisor 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/supervisor.log"

      - name: Capture targeted production evidence
        if: always()
        shell: bash
        run: |
          set +e
          cd "$CAREER_OS_RUNTIME"
          EVIDENCE_DIR=".career-os-ci/${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR/screenshots" "$EVIDENCE_DIR/traces"
          npm run worker:health 2>&1 | tee "$EVIDENCE_DIR/worker-health-final.log"
          npm run report:career-os 2>&1 | tee "$EVIDENCE_DIR/production-report-final.log"
          npm run openhands:status 2>&1 | tee "$EVIDENCE_DIR/openhands-status-final.log"
          find .career-os-browser-worker/screenshots -type f -name '*.png' -print0 2>/dev/null \
            | xargs -0 ls -t 2>/dev/null \
            | head -n 10 \
            | while IFS= read -r file; do cp "$file" "$EVIDENCE_DIR/screenshots/"; done
          find . -maxdepth 6 \( -name '*.trace' -o -name 'trace.zip' \) -print0 2>/dev/null \
            | xargs -0 ls -t 2>/dev/null \
            | head -n 5 \
            | while IFS= read -r file; do cp "$file" "$EVIDENCE_DIR/traces/$(basename "$file")"; done
          find "$EVIDENCE_DIR" -type f -maxdepth 4 -print > "$EVIDENCE_DIR/artifact-index.txt"

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-production-${{ github.run_id }}
          path: /Users/tomasnieves/Library/Application Support/CareerOSCompanionRuntime/answerbrief-ai-automation-starter/.career-os-ci/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30

      - name: Report runner completion
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: `Mac production runner finished.\n\n- Run: ${context.runId}\n- Commit: ${context.sha}\n- Result: ${{ job.status }}\n- Evidence artifact: career-os-production-${context.runId}\n- Time: ${new Date().toISOString()}`
            });
