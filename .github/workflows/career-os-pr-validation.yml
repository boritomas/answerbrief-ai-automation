name: Career OS PR Validation

on:
  pull_request:
    paths:
      - "answerbrief-ai-automation-starter/**"
      - ".github/workflows/career-os-pr-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-os-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: answerbrief-ai-automation-starter

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: answerbrief-ai-automation-starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
