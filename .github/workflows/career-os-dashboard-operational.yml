name: Career OS Dashboard Operational

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career-os-dashboard-operational.yml'

permissions:
  contents: read
  issues: write

jobs:
  deploy-dashboard:
    runs-on: [self-hosted]
    timeout-minutes: 45
    env:
      CAREER_OS_RUNTIME: /Users/tomasnieves/Library/Application Support/CareerOSCompanionRuntime/answerbrief-ai-automation-starter
      PATH: /Users/tomasnieves/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Synchronize runtime and start dashboard
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/answerbrief-ai-automation-starter"
          RUNTIME="$CAREER_OS_RUNTIME"
          mkdir -p "$RUNTIME"
          rsync -a --delete --exclude '.env' --exclude '.env.*' --exclude 'node_modules' --exclude '.next' "$SOURCE/" "$RUNTIME/"
          cd "$RUNTIME"
          npm ci
          npm run build
          pkill -f 'next start.*3000' || true
          nohup npm run start -- -H 0.0.0.0 -p 3000 > "$RUNNER_TEMP/career-os-dashboard.log" 2>&1 &
          echo $! > "$RUNTIME/.career-os-dashboard.pid"

      - name: Verify founder dashboard
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/founder-dashboard >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Founder dashboard did not become healthy.' >&2
          tail -200 "$RUNNER_TEMP/career-os-dashboard.log" || true
          exit 1

      - name: Report operational URL
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: `CAREER_OS_DASHBOARD_OPERATIONAL\n\nCareerOS Founder Dashboard is running and verified on the Mac runtime.\n\n- URL: http://localhost:3000/founder-dashboard\n- Run: ${context.runId}\n- Commit: ${context.sha}\n- Time: ${new Date().toISOString()}`
            });
