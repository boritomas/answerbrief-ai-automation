name: Career OS Force Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career-os-force-now.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: career-os-approved-queue-cloud
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run-approved-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: answerbrief-ai-automation-starter
    env:
      CAREER_OS_OWNER_EMAIL: tomas@nieves.com
      CAREER_OS_QUEUE_ENABLED: '1'
      CAREER_OS_DAILY_LIMIT: '165'
      CAREER_OS_DEBUG_CLAIM: '1'
      CAREER_OS_AUTO_REPAIR: '1'
      CAREER_OS_SUPERVISOR_MAX_ATTEMPTS: '3'
      CAREER_OS_EXECUTION_MODE: workday_first_submit
      APP_BASE_URL: https://www.answer-brief.com
      NEXT_PUBLIC_BASE_URL: https://www.answer-brief.com
      CAREER_OS_BROWSER_WORKER_TOKEN: ${{ secrets.CAREER_OS_BROWSER_WORKER_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKDAY_USERNAME: ${{ secrets.WORKDAY_USERNAME }}
      WORKDAY_PASSWORD: ${{ secrets.WORKDAY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: answerbrief-ai-automation-starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CAREER_OS_BROWSER_WORKER_TOKEN SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          npm run health:career-os

      - name: Drain approved application queue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ".career-os-ci/${GITHUB_RUN_ID}"
          npm run supervisor 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/approved-queue-supervisor.log"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-cloud-${{ github.run_id }}
          path: |
            answerbrief-ai-automation-starter/.career-os-ci/${{ github.run_id }}
            answerbrief-ai-automation-starter/.career-os-browser-worker/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: `CAREER_OS_CLOUD_FORCE_NOW_FINISHED\n\n- Run: ${context.runId}\n- Result: ${{ job.status }}\n- Runner: ubuntu-latest\n- Time: ${new Date().toISOString()}`
            });
