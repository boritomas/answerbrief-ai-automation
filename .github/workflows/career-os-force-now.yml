name: Career OS Force Now

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: career-os-approved-queue-cloud
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  run-approved-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: answerbrief-ai-automation-starter
    env:
      CAREER_OS_OWNER_EMAIL: tomas@nieves.com
      CAREER_OS_QUEUE_ENABLED: '1'
      CAREER_OS_DAILY_LIMIT: '3'
      CAREER_OS_DEBUG_CLAIM: '1'
      CAREER_OS_EXECUTION_MODE: workday_first_submit
      APP_BASE_URL: https://www.answer-brief.com
      NEXT_PUBLIC_BASE_URL: https://www.answer-brief.com
      WORKDAY_USERNAME: ${{ secrets.WORKDAY_USERNAME }}
      WORKDAY_PASSWORD: ${{ secrets.WORKDAY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: answerbrief-ai-automation-starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Acquire GitHub OIDC worker token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=answerbrief-career-os")"
          token="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(x.value||"")' <<< "$response")"
          test -n "$token"
          echo "CAREER_OS_BROWSER_WORKER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Validate deployed worker
        shell: bash
        run: npm run worker:health

      - name: Process three approved applications
        id: worker
        shell: bash
        run: |
          set +e
          dir=".career-os-ci/${GITHUB_RUN_ID}"
          mkdir -p "$dir"
          overall=0
          for attempt in 1 2 3; do
            echo "=== CAREER OS APPLICATION ATTEMPT ${attempt} ===" | tee "$dir/attempt-${attempt}.log"
            npm run worker:run-once 2>&1 | tee -a "$dir/attempt-${attempt}.log"
            code=${PIPESTATUS[0]}
            echo "exitCode=${code}" | tee -a "$dir/attempt-${attempt}.log"
            if [ "$code" -ne 0 ]; then
              overall="$code"
            fi
          done
          exit "$overall"

      - name: Create proof manifest
        if: always()
        shell: bash
        run: |
          set +e
          dir=".career-os-ci/${GITHUB_RUN_ID}"
          mkdir -p "$dir"
          submitted_count=0
          blocker_count=0
          for attempt in 1 2 3; do
            log="$dir/attempt-${attempt}.log"
            submitted=false
            blocker=false
            if [ -f "$log" ] && grep -Eiq 'submitted|application complete|thank you for applying|confirmation' "$log"; then
              submitted=true
              submitted_count=$((submitted_count + 1))
            fi
            if [ -f "$log" ] && grep -Eiq 'captcha|mfa|verification|required human|legal question|blocked' "$log"; then
              blocker=true
              blocker_count=$((blocker_count + 1))
            fi
            printf '{"attempt":%s,"submittedSignal":%s,"blockerSignal":%s}\n' "$attempt" "$submitted" "$blocker" > "$dir/attempt-${attempt}-proof.json"
          done
          screenshots=$(find .career-os-browser-worker/evidence -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) 2>/dev/null | wc -l | tr -d ' ')
          printf '{\n  "runId": "%s",\n  "commit": "%s",\n  "ownerEmail": "tomas@nieves.com",\n  "attempted": 3,\n  "submittedSignals": %s,\n  "blockerSignals": %s,\n  "screenshotCount": %s,\n  "generatedAt": "%s"\n}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$submitted_count" "$blocker_count" "${screenshots:-0}" "$(date -u +%FT%TZ)" > "$dir/submission-proof.json"
          cat "$dir/submission-proof.json"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-cloud-${{ github.run_id }}
          path: |
            answerbrief-ai-automation-starter/.career-os-ci/${{ github.run_id }}
            answerbrief-ai-automation-starter/.career-os-browser-worker/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const proofPath = `answerbrief-ai-automation-starter/.career-os-ci/${context.runId}/submission-proof.json`;
            let proof = null;
            try { proof = JSON.parse(fs.readFileSync(proofPath, 'utf8')); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: [
                'CAREER_OS_THREE_APPLICATION_CANARY_FINISHED',
                '',
                `- Run: ${context.runId}`,
                `- Result: ${{ job.status }}`,
                '- Runner: ubuntu-latest',
                '- Auth: GitHub OIDC',
                `- Attempts: ${proof?.attempted ?? 3}`,
                `- Submitted signals: ${proof?.submittedSignals ?? 0}`,
                `- Blocker signals: ${proof?.blockerSignals ?? 0}`,
                `- Screenshot evidence: ${proof?.screenshotCount ?? 0}`,
                `- Evidence artifact: career-os-cloud-${context.runId}`,
                '- Owner email: tomas@nieves.com',
                `- Time: ${new Date().toISOString()}`,
              ].join('\n')
            });
