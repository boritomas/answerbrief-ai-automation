name: Career OS Force Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career-os-force-now.yml'
      - 'answerbrief-ai-automation-starter/package.json'
      - 'answerbrief-ai-automation-starter/scripts/**'
      - 'answerbrief-ai-automation-starter/lib/**'
      - 'answerbrief-ai-automation-starter/app/api/**'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: career-os-approved-queue-cloud
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  run-approved-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: answerbrief-ai-automation-starter
    env:
      CAREER_OS_OWNER_EMAIL: tomas@nieves.com
      CAREER_OS_QUEUE_ENABLED: '1'
      CAREER_OS_DAILY_LIMIT: '165'
      CAREER_OS_DEBUG_CLAIM: '1'
      CAREER_OS_EXECUTION_MODE: workday_first_submit
      APP_BASE_URL: https://www.answer-brief.com
      NEXT_PUBLIC_BASE_URL: https://www.answer-brief.com
      WORKDAY_USERNAME: ${{ secrets.WORKDAY_USERNAME }}
      WORKDAY_PASSWORD: ${{ secrets.WORKDAY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: answerbrief-ai-automation-starter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Acquire GitHub OIDC worker token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=answerbrief-career-os")"
          token="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(x.value||"")' <<< "$response")"
          test -n "$token"
          echo "CAREER_OS_BROWSER_WORKER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Validate deployed worker
        shell: bash
        run: npm run worker:health

      - name: Process next approved application
        id: worker
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ".career-os-ci/${GITHUB_RUN_ID}"
          npm run worker:run-once 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/approved-queue-worker.log"

      - name: Create proof manifest
        if: always()
        shell: bash
        run: |
          set +e
          dir=".career-os-ci/${GITHUB_RUN_ID}"
          log="$dir/approved-queue-worker.log"
          mkdir -p "$dir"
          submitted=false
          if [ -f "$log" ] && grep -Eiq 'submitted|application complete|thank you for applying|confirmation' "$log"; then
            submitted=true
          fi
          screenshots=$(find .career-os-browser-worker/evidence -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \) 2>/dev/null | wc -l | tr -d ' ')
          printf '{\n  "runId": "%s",\n  "commit": "%s",\n  "ownerEmail": "tomas@nieves.com",\n  "submittedSignal": %s,\n  "screenshotCount": %s,\n  "generatedAt": "%s"\n}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$submitted" "${screenshots:-0}" "$(date -u +%FT%TZ)" > "$dir/submission-proof.json"
          cat "$dir/submission-proof.json"

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-cloud-${{ github.run_id }}
          path: |
            answerbrief-ai-automation-starter/.career-os-ci/${{ github.run_id }}
            answerbrief-ai-automation-starter/.career-os-browser-worker/evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const proofPath = `answerbrief-ai-automation-starter/.career-os-ci/${context.runId}/submission-proof.json`;
            let proof = null;
            try { proof = JSON.parse(fs.readFileSync(proofPath, 'utf8')); } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: [
                'CAREER_OS_CLOUD_FORCE_NOW_FINISHED',
                '',
                `- Run: ${context.runId}`,
                `- Result: ${{ job.status }}`,
                '- Runner: ubuntu-latest',
                '- Auth: GitHub OIDC',
                `- Submitted signal: ${proof?.submittedSignal ?? false}`,
                `- Screenshot evidence: ${proof?.screenshotCount ?? 0}`,
                `- Evidence artifact: career-os-cloud-${context.runId}`,
                `- Owner email: tomas@nieves.com`,
                `- Time: ${new Date().toISOString()}`,
              ].join('\n')
            });

# proof-driven forced cloud execution: 2026-08-03T15:50:00Z
