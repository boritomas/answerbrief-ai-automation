name: Career OS Force Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/career-os-force-now.yml'
  workflow_dispatch:

concurrency:
  group: career-os-approved-queue-main
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  run-approved-queue:
    runs-on: [self-hosted]
    timeout-minutes: 720
    env:
      CAREER_OS_RUNTIME: /Users/tomasnieves/Library/Application Support/CareerOSCompanionRuntime/answerbrief-ai-automation-starter
      CAREER_OS_SOURCE: ${{ github.workspace }}/answerbrief-ai-automation-starter
      CAREER_OS_OWNER_EMAIL: tomas@nieves.com
      CAREER_OS_QUEUE_ENABLED: '1'
      CAREER_OS_DAILY_LIMIT: '165'
      CAREER_OS_DEBUG_CLAIM: '1'
      CAREER_OS_AUTO_REPAIR: '1'
      CAREER_OS_SUPERVISOR_MAX_ATTEMPTS: '3'
      ANSWERBRIEF_EXECUTOR_PROVIDER_ORDER: openhands,gemini,opencode,aider,claude-code,codex
      PATH: /Users/tomasnieves/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Deploy current main to canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test -d "$CAREER_OS_RUNTIME"
          test -f "$CAREER_OS_SOURCE/package.json"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.career-os-browser-worker/' \
            --exclude='.career-os-control/' \
            --exclude='.career-os-ci/' \
            "$CAREER_OS_SOURCE/" "$CAREER_OS_RUNTIME/"
          cd "$CAREER_OS_RUNTIME"
          npm ci

      - name: Drain approved application queue now
        shell: bash
        run: |
          set -euo pipefail
          cd "$CAREER_OS_RUNTIME"
          set -a
          if [ -f .env ]; then . ./.env; fi
          if [ -f .env.local ]; then . ./.env.local; fi
          set +a
          export CAREER_OS_OWNER_EMAIL="${CAREER_OS_OWNER_EMAIL:-tomas@nieves.com}"
          export CAREER_OS_QUEUE_ENABLED='1'
          export CAREER_OS_DAILY_LIMIT='165'
          mkdir -p ".career-os-ci/${GITHUB_RUN_ID}"
          npm run supervisor 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/approved-queue-supervisor.log"

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: `CAREER_OS_FORCE_NOW_FINISHED\n\n- Run: ${context.runId}\n- Result: ${{ job.status }}\n- Time: ${new Date().toISOString()}`
            });
