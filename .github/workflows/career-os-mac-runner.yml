name: Career OS Mac Runner

on:
  schedule:
    # Morning, noon, and evening Central during daylight saving time.
    - cron: '20 12 * * *'
    - cron: '20 17 * * *'
    - cron: '20 23 * * *'
  workflow_dispatch:

concurrency:
  group: career-os-mac-runner
  cancel-in-progress: false

jobs:
  career-os:
    runs-on: [self-hosted, macOS, ARM64, career-os]
    timeout-minutes: 90
    env:
      CAREER_OS_WORKER_BATCH_LIMIT: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load local Career OS environment
        shell: bash
        run: |
          set -euo pipefail
          set +x
          RUNTIME="$HOME/Library/Application Support/CareerOSCompanionRuntime/answerbrief-ai-automation-starter"
          ENV_FILE="$RUNTIME/.env.local"

          test -f "$ENV_FILE" || { echo "Career OS .env.local file not found at $ENV_FILE"; exit 1; }
          echo "Found Career OS env file: $ENV_FILE"
          echo "CAREER_OS_RUN_STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

          while IFS= read -r line || [ -n "$line" ]; do
            line="${line%$'\r'}"
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ "$line" =~ ^[[:space:]]*export[[:space:]]+ ]]; then
              line="${line#export }"
            fi
            [[ "$line" != *"="* ]] && continue

            key="${line%%=*}"
            value="${line#*=}"

            key="$(echo "$key" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
            [[ -z "$key" ]] && continue

            {
              echo "$key<<__EOF__"
              echo "$value"
              echo "__EOF__"
            } >> "$GITHUB_ENV"
          done < "$ENV_FILE"

          echo "Exported environment variable names from .env.local:"
          awk -F= '
            /^[[:space:]]*#/ {next}
            /^[[:space:]]*$/ {next}
            {
              line=$0
              sub(/\r$/, "", line)
              sub(/^[[:space:]]*export[[:space:]]+/, "", line)
              if (index(line, "=") > 0) {
                key=line
                sub(/=.*/, "", key)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", key)
                if (length(key) > 0) print "- " key
              }
            }
          ' "$ENV_FILE"

          grep -qE '^[[:space:]]*(export[[:space:]]+)?SUPABASE_URL=' "$ENV_FILE" || { echo "Missing required SUPABASE_URL in .env.local"; exit 1; }
          grep -qE '^[[:space:]]*(export[[:space:]]+)?SUPABASE_SERVICE_ROLE_KEY=' "$ENV_FILE" || { echo "Missing required SUPABASE_SERVICE_ROLE_KEY in .env.local"; exit 1; }
          grep -qE '^[[:space:]]*(export[[:space:]]+)?CRON_SECRET=' "$ENV_FILE" || { echo "Missing required CRON_SECRET in .env.local"; exit 1; }

      - name: Run Career OS source discovery
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          node scripts/run-career-os-source.mjs --persist

      - name: Run Career OS daily cycle
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${APP_BASE_URL:-${NEXT_PUBLIC_BASE_URL:-https://www.answer-brief.com}}"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL%/}/api/career-os/daily-run"

      - name: Run local browser worker batch
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="/Users/tomasnieves/Library/Application Support/CareerOSCompanionRuntime/answerbrief-ai-automation-starter"
          cd "$RUNTIME"
          npm install
          npm run worker:health || true
          node ./scripts/career-os-browser-companion.mjs run-batch --limit "${CAREER_OS_WORKER_BATCH_LIMIT:-5}"
          npm run worker:health || true

      - name: Write Career OS run report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME="/Users/tomasnieves/Library/Application Support/CareerOSCompanionRuntime/answerbrief-ai-automation-starter"
          REPORT_DIR="$RUNTIME/.career-os-browser-worker/reports"
          REPORT_FILE="$REPORT_DIR/career-os-report-$(date -u '+%Y%m%dT%H%M%SZ').md"
          mkdir -p "$REPORT_DIR"
          cd "$RUNTIME"
          node "$GITHUB_WORKSPACE/answerbrief-ai-automation-starter/scripts/career-os-run-report.mjs" --markdown | tee "$REPORT_FILE"
          {
            echo ""
            echo "Report saved on this Mac: $REPORT_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
