name: Update Career OS compensation policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-career-os-compensation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace stale compensation thresholds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          active_targets = [
              Path('scripts/run-career-os-source.mjs'),
              Path('answerbrief-ai-automation-starter/lib/career-os-daily-cycle.ts'),
          ]

          replacements = {
              '250000': '200000',
              '225000': '200000',
              '$250,000': '$200,000',
              '$225,000': '$200,000',
              '$250K': '$200K',
              '$225K': '$200K',
              '250K': '200K',
              '225K': '200K',
              'use_approved_250000_base_strategy_where_appropriate': 'use_approved_200000_base_strategy_where_appropriate',
              'use_approved_225000_base_strategy_where_appropriate': 'use_approved_200000_base_strategy_where_appropriate',
          }

          changed = []
          for path in active_targets:
              if not path.exists():
                  raise SystemExit(f'Missing required active target: {path}')
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          policy = Path('docs/CAREER_OS_COMPENSATION_POLICY.md')
          policy.write_text(
              '# Career OS Compensation Policy\n\n'
              '- Canonical minimum compensation floor: **$200,000 USD**.\n'
              '- Effective date: 2026-07-28.\n'
              '- Supersedes prior $225,000 and $250,000 thresholds.\n'
              '- Do not reject a role solely because compensation is not published.\n'
              '- A published range reaching or exceeding $200,000 passes the compensation screen, subject to role fit and location policy.\n'
              '- Clearly below-floor roles remain held or rejected unless a documented exception applies.\n',
              encoding='utf-8',
          )
          print('Changed:', ', '.join(changed) if changed else 'no active target changes')
          PY

      - name: Verify active policy
        shell: bash
        run: |
          if grep -nE '250000|225000|\$250,000|\$225,000|250K|225K|use_approved_(250000|225000)' \
            scripts/run-career-os-source.mjs \
            answerbrief-ai-automation-starter/lib/career-os-daily-cycle.ts; then
            echo 'Stale compensation threshold remains in active Career OS files.' >&2
            exit 1
          fi
          grep -nE '200000|\$200,000|200K|use_approved_200000' \
            scripts/run-career-os-source.mjs \
            answerbrief-ai-automation-starter/lib/career-os-daily-cycle.ts \
            docs/CAREER_OS_COMPENSATION_POLICY.md

      - name: Commit corrected policy
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-career-os-source.mjs \
            answerbrief-ai-automation-starter/lib/career-os-daily-cycle.ts \
            docs/CAREER_OS_COMPENSATION_POLICY.md
          git commit -m 'fix(career-os): set canonical compensation floor to $200K [skip ci]'
          git push origin HEAD:main
