name: Career OS Production Command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch-production-canary:
    if: >-
      github.event.issue.number == 49 &&
      github.event.comment.user.login == 'boritomas' &&
      contains(github.event.comment.body, 'TRIGGER_PRODUCTION_CANARY')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Mac production canary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'career-os-mac-production.yml',
              ref: context.payload.repository.default_branch,
              inputs: { run_canary: 'true' }
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: `Career OS production command accepted.\n\n- Requested by: ${context.actor}\n- Target workflow: career-os-mac-production.yml\n- Ref: ${context.payload.repository.default_branch}\n- Time: ${new Date().toISOString()}`
            });
