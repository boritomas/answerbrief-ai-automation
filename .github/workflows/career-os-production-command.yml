name: Career OS Production Command

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch-production-canary:
    if: >-
      github.event.issue.number == 49 &&
      contains(github.event.comment.body, 'TRIGGER_PRODUCTION_CANARY')
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale production run and dispatch canary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const staleRunId = 30729185178;
            try {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: staleRunId
              });
            } catch (error) {
              core.info(`Stale run ${staleRunId} could not be canceled or was already complete: ${error.message}`);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'career-os-mac-production.yml',
              ref: context.payload.repository.default_branch,
              inputs: { run_canary: 'true' }
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: `Career OS production command accepted.\n\n- Requested by: ${context.actor}\n- Stale run cancellation attempted: ${staleRunId}\n- Target workflow: career-os-mac-production.yml\n- Ref: ${context.payload.repository.default_branch}\n- Time: ${new Date().toISOString()}`
            });
