name: Hotfix blocker classification

on:
  push:
    branches:
      - hotfix/blocker-classification
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[skip blocker hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/blocker-classification

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: answerbrief-ai-automation-starter/package-lock.json

      - name: Patch blocker classification
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('answerbrief-ai-automation-starter/lib/career-os-queue.ts')
          text = path.read_text()

          for term in [
              "  'captcha',\n",
              "  'account',\n",
              "  'workday',\n",
          ]:
              text = text.replace(term, '')

          old = """const TECHNICAL_BLOCKER_TERMS = [
  'technical blocker',
  'technical failure',
"""
          new = """const TECHNICAL_BLOCKER_TERMS = [
  'technical blocker',
  'technical failure',
  'unsupported browser or ats operation',
  'unsupported browser operation',
  'unsupported ats operation',
  'selector not found',
  'navigation timeout',
  'browser timeout',
  'resume upload failure',
  'file picker',
"""
          if old not in text:
              raise SystemExit('Expected technical blocker array anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Add blocker classification regression test
        run: |
          cat > answerbrief-ai-automation-starter/tests/acceptance/career-os-blocker-classification.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          const source = fs.readFileSync(new URL('../../lib/career-os-queue.ts', import.meta.url), 'utf8');

          test('generic CAPTCHA, account, and Workday labels are not human blocker terms', () => {
            const humanTerms = source.match(/const HUMAN_BLOCKER_TERMS = \[([\s\S]*?)\n\];/)?.[1] || '';
            assert.equal(humanTerms.includes("'captcha'"), false);
            assert.equal(humanTerms.includes("'account'"), false);
            assert.equal(humanTerms.includes("'workday'"), false);
          });

          test('unsupported browser and ATS operations are technical blockers', () => {
            const technicalTerms = source.match(/const TECHNICAL_BLOCKER_TERMS = \[([\s\S]*?)\n\];/)?.[1] || '';
            assert.equal(technicalTerms.includes("'unsupported browser or ats operation'"), true);
            assert.equal(technicalTerms.includes("'selector not found'"), true);
            assert.equal(technicalTerms.includes("'resume upload failure'"), true);
          });

          test('technical classification is evaluated before human classification', () => {
            const fnStart = source.indexOf('function humanOrTechnicalBlocker');
            assert.notEqual(fnStart, -1);
            const fn = source.slice(fnStart, fnStart + 1800);
            const technicalCheck = fn.indexOf('TECHNICAL_BLOCKER_TERMS');
            const humanCheck = fn.indexOf('HUMAN_BLOCKER_TERMS');
            assert.notEqual(technicalCheck, -1);
            if (humanCheck !== -1) assert.ok(technicalCheck < humanCheck);
          });
          EOF

      - name: Install dependencies
        working-directory: answerbrief-ai-automation-starter
        run: npm ci

      - name: Validate hotfix
        working-directory: answerbrief-ai-automation-starter
        run: |
          node --test tests/acceptance/career-os-blocker-classification.test.mjs
          npm run typecheck

      - name: Commit hotfix
        run: |
          git config user.name 'career-os-hotfix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add answerbrief-ai-automation-starter/lib/career-os-queue.ts \
                  answerbrief-ai-automation-starter/tests/acceptance/career-os-blocker-classification.test.mjs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: classify browser and ATS failures as technical [skip blocker hotfix]'
          git push origin hotfix/blocker-classification
