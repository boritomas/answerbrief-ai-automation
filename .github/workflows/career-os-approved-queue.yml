name: Career OS Approved Queue Production

on:
  workflow_dispatch:
    inputs:
      application_limit:
        description: Maximum approved applications to process
        required: true
        default: '165'
        type: string
      owner_email:
        description: Career OS owner email
        required: true
        default: 'tomas@nieves.com'
        type: string

# Allow the authoritative queue drain to finish. New requests wait rather than
# canceling an active browser-submission run.
concurrency:
  group: career-os-approved-queue-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write
  id-token: write

jobs:
  run-approved-queue:
    runs-on: [self-hosted]
    timeout-minutes: 720
    env:
      CAREER_OS_RUNTIME: /Users/tomasnieves/Library/Application Support/CareerOSCompanionRuntime/answerbrief-ai-automation-starter
      CAREER_OS_SOURCE: ${{ github.workspace }}/answerbrief-ai-automation-starter
      CAREER_OS_OWNER_EMAIL: ${{ inputs.owner_email || 'tomas@nieves.com' }}
      CAREER_OS_QUEUE_ENABLED: '1'
      CAREER_OS_DAILY_LIMIT: ${{ inputs.application_limit || '165' }}
      CAREER_OS_DEBUG_CLAIM: '1'
      CAREER_OS_AUTO_REPAIR: '1'
      CAREER_OS_SUPERVISOR_MAX_ATTEMPTS: '3'
      ANSWERBRIEF_EXECUTOR_PROVIDER_ORDER: openhands,gemini,opencode,aider,claude-code,codex
      PATH: /Users/tomasnieves/.local/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: false
          fetch-depth: 1

      - name: Report queue start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: `CAREER_OS_APPROVED_QUEUE_STARTED\n\n- Run: ${context.runId}\n- Limit: ${process.env.CAREER_OS_DAILY_LIMIT}\n- Owner: ${process.env.CAREER_OS_OWNER_EMAIL}\n- Trigger: ${context.eventName}\n- Runner: ${process.env.RUNNER_NAME || 'unknown'}\n- Time: ${new Date().toISOString()}`
            });

      - name: Deploy current main to canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test -d "$CAREER_OS_RUNTIME"
          test -f "$CAREER_OS_SOURCE/package.json"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.career-os-browser-worker/' \
            --exclude='.career-os-control/' \
            --exclude='.career-os-ci/' \
            "$CAREER_OS_SOURCE/" "$CAREER_OS_RUNTIME/"
          cd "$CAREER_OS_RUNTIME"
          npm ci

      - name: Acquire GitHub OIDC worker token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=answerbrief-career-os")"
          token="$(node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(0,"utf8")); process.stdout.write(x.value||"")' <<< "$response")"
          test -n "$token"
          echo "CAREER_OS_BROWSER_WORKER_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Drain approved application queue
        shell: bash
        run: |
          set -euo pipefail
          cd "$CAREER_OS_RUNTIME"
          set -a
          if [ -f .env ]; then . ./.env; fi
          if [ -f .env.local ]; then . ./.env.local; fi
          set +a
          export CAREER_OS_OWNER_EMAIL="${CAREER_OS_OWNER_EMAIL:-tomas@nieves.com}"
          export CAREER_OS_QUEUE_ENABLED="1"
          export CAREER_OS_DAILY_LIMIT="${CAREER_OS_DAILY_LIMIT:-165}"
          limit="$CAREER_OS_DAILY_LIMIT"
          mkdir -p ".career-os-ci/${GITHUB_RUN_ID}"
          npm run health:career-os 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/approved-queue-health.log"
          npm run worker:health 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/approved-queue-worker-health.log"
          npm run worker:run-batch -- --limit "$limit" 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/approved-queue-worker-batch.log"
          npm run report:career-os 2>&1 | tee ".career-os-ci/${GITHUB_RUN_ID}/approved-queue-report.log"

      - name: Capture final queue evidence
        if: always()
        shell: bash
        run: |
          set +e
          cd "$CAREER_OS_RUNTIME"
          set -a
          if [ -f .env ]; then . ./.env; fi
          if [ -f .env.local ]; then . ./.env.local; fi
          set +a
          EVIDENCE_DIR=".career-os-ci/${GITHUB_RUN_ID}"
          mkdir -p "$EVIDENCE_DIR/screenshots"
          npm run worker:health 2>&1 | tee "$EVIDENCE_DIR/worker-health-final.log"
          npm run report:career-os 2>&1 | tee "$EVIDENCE_DIR/production-report-final.log"
          find .career-os-browser-worker/screenshots -type f -name '*.png' -print0 2>/dev/null \
            | xargs -0 ls -t 2>/dev/null \
            | head -n 25 \
            | while IFS= read -r file; do cp "$file" "$EVIDENCE_DIR/screenshots/"; done
          find "$EVIDENCE_DIR" -type f -maxdepth 4 -print > "$EVIDENCE_DIR/artifact-index.txt"

      - name: Upload queue evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-os-approved-queue-${{ github.run_id }}
          path: /Users/tomasnieves/Library/Application Support/CareerOSCompanionRuntime/answerbrief-ai-automation-starter/.career-os-ci/${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14

      - name: Report queue completion
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 49,
              body: `CAREER_OS_APPROVED_QUEUE_FINISHED\n\n- Run: ${context.runId}\n- Result: ${{ job.status }}\n- Evidence: career-os-approved-queue-${context.runId}\n- Time: ${new Date().toISOString()}`
            });
