<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Workday Fixture - Sign In Gate</title>
  </head>
  <body>
    <main data-workday-state="SIGN_IN" data-fixture-scenario="account_gate">
      <h1>Sign in to Workday</h1>
      <p>Use your candidate account to continue this application.</p>
      <form data-auth-gate="true" data-mfa-required="true">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password">
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
