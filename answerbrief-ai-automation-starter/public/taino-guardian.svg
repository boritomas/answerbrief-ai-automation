<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">TAINO holographic guardian</title>
  <desc id="desc">A stylized Taíno-inspired digital guardian rendered in luminous green data lines.</desc>
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5fff3" stop-opacity=".94"/>
      <stop offset=".45" stop-color="#48ffbd" stop-opacity=".72"/>
      <stop offset="1" stop-color="#057d65" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8affd2" stop-opacity=".88"/>
      <stop offset="1" stop-color="#072f2a" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#4dffc1" stop-opacity=".35"/>
      <stop offset="1" stop-color="#4dffc1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 1h8" stroke="#8affd2" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="bust"><path d="M150 1000V730c35-135 124-205 250-222 126 17 215 87 250 222v270Z"/></clipPath>
  </defs>
